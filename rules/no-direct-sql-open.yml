id: no-direct-sql-open
language: go
severity: error
message: Use database.Open instead of sql.Open — it sets the sqlite busy timeout.
note: |
  All sqlite connections must be created through database.Open
  (tui/database/sql.go), which appends `_busy_timeout=5000` to the DSN.
  lflow's one-shot CLI commands can run concurrently with an open inline editor,
  all sharing one DB file; without the busy timeout, a concurrent writer fails
  immediately with SQLITE_BUSY instead of waiting. Calling sql.Open directly
  bypasses that and reintroduces the race, so
  it is only permitted inside tui/database/sql.go (the one wrapper that owns
  the DSN).
rule:
  pattern:
    context: "v := sql.Open($$$)"
    selector: call_expression
ignores:
  - tui/database/sql.go
  # the daemon's single-writer store builds its own DSN (busy timeout AND WAL)
  # on a custom driver with an update hook — database.Open cannot express it
  - tui/daemon/store.go
  # the zotero test helpers seed a throwaway FAKE Zotero library (a file Zotero
  # itself would own) — no lflow process ever shares it, so the busy-timeout
  # race the rule guards against cannot happen there
  - tui/integrations/zotero_library_test.go
